<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
</head>
<body>
    <main>
        <div class="container">
            <h1>Password Generator</h1>
            
            <div class="password-group">
                <div class="password-item">
                    <div class="password-label">20 characters</div>
                    <div class="password-display">
                        <code class="password-text" id="password-20"></code>
                        <button class="copy-btn" onclick="copyToClipboard('password-20', this)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="password-item">
                    <div class="password-label">30 characters</div>
                    <div class="password-display">
                        <code class="password-text" id="password-30"></code>
                        <button class="copy-btn" onclick="copyToClipboard('password-30', this)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="password-item">
                    <div class="password-label">40 characters</div>
                    <div class="password-display">
                        <code class="password-text" id="password-40"></code>
                        <button class="copy-btn" onclick="copyToClipboard('password-40', this)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="password-item">
                    <div class="password-label">40 characters (letters &amp; numbers)</div>
                    <div class="password-display">
                        <code class="password-text" id="password-40-alnum"></code>
                        <button class="copy-btn" onclick="copyToClipboard('password-40-alnum', this)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="password-item">
                    <div class="password-label">100 characters</div>
                    <div class="password-display">
                        <code class="password-text" id="password-100"></code>
                        <button class="copy-btn" onclick="copyToClipboard('password-100', this)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="password-item dynamic-item">
                    <div class="password-label-dynamic">
                        <span>Custom length</span>
                        <span id="length-value" class="length-display">20</span>
                    </div>
                    <input type="range" 
                           id="length-slider" 
                           class="length-slider" 
                           min="8" 
                           max="128" 
                           value="20"
                           oninput="updateDynamicPassword()">
                    <div class="password-display">
                        <code class="password-text" id="password-dynamic"></code>
                        <button class="copy-btn" onclick="copyToClipboard('password-dynamic', this)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <button class="refresh-btn" onclick="generateAllPasswords()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Generate
            </button>
        </div>
    </main>

    <script>
        const charset = Array.from(
            { length: 94 },
            (_, index) => String.fromCharCode(index + 33)
        ).join('');
        const alphanumericCharset =
            'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const generatedPasswords = new Set();

        function generatePassword(length, chars = charset) {
            const randomNumberRange = 0x100000000;
            const unbiasedLimit = randomNumberRange - (randomNumberRange % chars.length);
            const randomValues = new Uint32Array(length);
            let password;

            do {
                password = '';

                while (password.length < length) {
                    crypto.getRandomValues(randomValues);

                    for (const value of randomValues) {
                        if (value < unbiasedLimit) {
                            password += chars[value % chars.length];
                        }

                        if (password.length === length) {
                            break;
                        }
                    }
                }
            } while (generatedPasswords.has(password));

            generatedPasswords.add(password);
            return password;
        }

        function generateAllPasswords() {
            document.getElementById('password-20').textContent = generatePassword(20);
            document.getElementById('password-30').textContent = generatePassword(30);
            document.getElementById('password-40').textContent = generatePassword(40);
            document.getElementById('password-40-alnum').textContent =
                generatePassword(40, alphanumericCharset);
            document.getElementById('password-100').textContent = generatePassword(100);
            updateDynamicPassword();
        }

        function updateDynamicPassword() {
            const slider = document.getElementById('length-slider');
            const length = parseInt(slider.value);
            document.getElementById('length-value').textContent = length;
            document.getElementById('password-dynamic').textContent = generatePassword(length);
        }

        function copyToClipboard(elementId, button) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = button.innerHTML;
                button.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.innerHTML = originalHTML;
                    button.classList.remove('copied');
                }, 2000);
            });
        }

        window.addEventListener('load', generateAllPasswords);
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #2a2a2a;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
        }

        main {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
        }

        .container {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 2.5rem;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .password-group {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .password-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
        }

        .password-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-align: center;
        }

        .password-label-dynamic {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 0.75rem;
            width: 100%;
            max-width: 600px;
        }

        .length-display {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9375rem;
        }

        .dynamic-item {
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
            margin-top: 0.5rem;
        }

        .length-slider {
            width: 100%;
            max-width: 600px;
            height: 12px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--bg-tertiary);
            border-radius: 6px;
            outline: none;
            margin-bottom: 1rem;
            cursor: pointer;
        }

        .length-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .length-slider::-webkit-slider-thumb:hover {
            background: var(--accent-hover);
            transform: scale(1.1);
        }

        .length-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .length-slider::-moz-range-thumb:hover {
            background: var(--accent-hover);
            transform: scale(1.1);
        }

        .length-slider::-webkit-slider-runnable-track {
            height: 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
        }

        .length-slider::-moz-range-track {
            height: 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
        }

        .password-display {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            transition: border-color 0.2s;
        }

        .password-display:hover {
            border-color: var(--accent);
        }

        .password-text {
            flex: 1;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
            font-size: 0.875rem;
            color: var(--text-primary);
            word-break: break-all;
            user-select: all;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .copy-btn.copied {
            color: var(--success);
        }

        .refresh-btn {
            width: auto;
            background: green;
            color: white;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.2s;
            margin: 0 auto;
        }

        .refresh-btn:hover {
            background: #059669;
        }

        .refresh-btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            .container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 2rem;
            }

            .password-text {
                font-size: 0.75rem;
            }
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #ffffff;
                --bg-secondary: #f9fafb;
                --bg-tertiary: #f3f4f6;
                --text-primary: #111827;
                --text-secondary: #6b7280;
                --border: #e5e7eb;
            }
        }
    </style>
    
</body>
</html>
