services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: password-generator
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - password-generator-network

networks:
  password-generator-network:
    driver: bridge